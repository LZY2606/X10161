[package]
name = "reasm-bench"
version = "0.1.0"
edition = "2021"
description = "离线抓包网络会话重组台"

[lib]
name = "reasm_bench"
path = "src/lib.rs"

[[bin]]
name = "reasm-bench"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 0
