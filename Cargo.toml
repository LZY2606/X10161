[package]
name = "session-reassembly"
version = "0.1.0"
edition = "2021"
description = "Offline network session reassembly workbench (no live capture)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lib]
name = "reasm"
path = "src/lib.rs"

[[bin]]
name = "session-reassembly"
path = "src/main.rs"
